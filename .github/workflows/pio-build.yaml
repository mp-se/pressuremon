name: Build CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build UI version info
        working-directory: ui
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          REV=`git rev-parse HEAD | rev | cut -c 1-6 | rev`
          # VITE_APP_VERSION stays as committed in ui/.env (tags lag behind it)
          echo "VITE_APP_BUILD=..$REV" >> .env
          cat .env

      - name: Build UI
        working-directory: ui
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Copy UI to html
        run: |
          cp ui/dist/assets/style.css.gz html/app.css.gz
          cp ui/dist/assets/index.js.gz html/app.js.gz

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          # intelhex is required by PlatformIO but missing from its dependencies
          pip install platformio intelhex

      - name: PlatformIO Run
        run: pio run -e pressure-32s3_mini -e pressure-32s2_mini -e pressure-32c3_pico -j 1 -v

      # Pull requests only verify that the build works, nothing is committed
      - uses: EndBug/add-and-commit@v11
        if: github.event_name == 'push'
        with:
          add: 'bin html'
          author_name: GitHub Action
          author_email: mp-se@noreply.github.com
          default_author: github_actor
          message: 'GitHub Action Build'
          pathspec_error_handling: ignore
