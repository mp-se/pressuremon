name: PlatformIO CI

on: 
  workflow_dispatch:
  pull_request:
  push:
    branches: 
      - dev

      
jobs:
  pio-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Use repository UI
        run: |
          echo "Use local UI under ui/"
          cp ui/dist/assets/style.css.gz html/app.css.gz || true
          cp ui/dist/assets/index.js.gz html/app.js.gz || true
          cp ui/pressuremon.html html/index.html || true
          cp ui/dist/favicon.ico html/favicon.ico || true
          gzip -f html/favicon.ico || true

          # If you still want to source shared code from an external repo,
          # restore the commented commands below.

      - name: Install PlatformIO dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio intelhex

      - name: PlatformIO Run
        run: |
          pio run \
            --environment pressure-32s3_mini \
            --environment pressure-32s2_mini \
            --environment pressure-32c3_pico \
            --jobs 1 \
            --verbose
    
      - uses: EndBug/add-and-commit@v9 # You can change this to use a specific version. https://github.com/marketplace/actions/add-commit
        with:
          add: 'bin html'
          author_name: GitHub Action
          author_email: mp-se@noreply.github.com
          default_author: github_actor
          message: 'GitHub Action Build'
          pathspec_error_handling: ignore
