name: Build documentation

on:
  push:
    branches: [master]
    paths:
      - 'src_docs/**'
      - '.github/workflows/doc-build.yaml'
  pull_request:
    paths:
      - 'src_docs/**'
      - '.github/workflows/doc-build.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install documentation dependencies
        run: python -m pip install -r src_docs/requirements.txt
      - name: Build documentation
        run: sphinx-build -E -W --keep-going -b html src_docs/source src_docs/build/html
      - name: Publish to ghpages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ghpages
          publish_dir: src_docs/build/html
